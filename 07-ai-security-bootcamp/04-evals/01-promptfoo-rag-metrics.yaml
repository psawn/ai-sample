# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# =======================================================================
# EVAL 1: PROMPTFOO — KIỂM TRA 6 METRIC CÓ CHẤM ĐÚNG KHÔNG
#
# Mục tiêu: đưa Promptfoo các câu trả lời viết sẵn (tốt / trung bình / tệ), xem mỗi metric
# chấm có đúng không: câu tốt phải đạt, câu trung bình và tệ phải rớt.
#
# 1. Vì sao kiểm tra metric trước?
#    - App LLM mỗi lần trả lời câu chữ khác nhau → không so chuỗi được → phải nhờ 1 LLM khác (JUDGE) chấm.
#    - Metric hoặc judge chấm sai thì mọi điểm số về sau đều vô nghĩa.
#
# 2. Provider `echo` không gọi LLM, trả lại nguyên `{{response}}` → câu trả lời chính là câu viết sẵn.
#    Biết trước câu nào tốt, câu nào tệ → so với điểm metric chấm là biết metric đúng hay sai.
#
# 3. Judge và embedding (khai báo ở `defaultTest` bên dưới):
#    - Judge: LLM chấm câu trả lời. Model nhỏ quá hay trả lời sai format → bị tính 0 điểm.
#    - EMBEDDING: model biến câu thành dãy số để đo 2 câu giống nhau bao nhiêu. Chỉ `answer-relevance` dùng.
#    - Groq free tier giới hạn token/phút. Chạm giới hạn → Promptfoo có thể chờ rất lâu.
#
# 4. 6 metric, mỗi metric phát hiện 1 loại lỗi (điểm 0–1, đạt khi ≥ 0.75):
#    - Bịa thông tin → `context-faithfulness`: tách câu trả lời thành từng ý.
#      Điểm = số ý có trong context / tổng số ý.
#    - Lạc đề → `answer-relevance`: judge đoán ngược câu hỏi từ câu trả lời.
#      Điểm = câu hỏi đoán ra giống câu hỏi thật bao nhiêu (đo bằng embedding).
#    - Context lẫn rác → `context-relevance`: điểm = số đoạn context liên quan câu hỏi / tổng số đoạn (không xét thứ tự).
#      Mẫu TỐT có 1/3 đoạn rác → chỉ được ~0.67 nên rớt. Đúng với cách tính, không phải lỗi.
#    - Context thiếu ý → `context-recall`: điểm = số ý của đáp án mẫu tìm thấy trong context / tổng số ý.
#    - Sai sự thật → `factuality`: so với đáp án mẫu. Mâu thuẫn → 0 điểm, còn lại → 1 điểm.
#    - Gọi sai tool → `tool-call-f1`: so tên tool bằng code. F1 trừ điểm cả gọi thừa lẫn gọi thiếu.
#      VD: gọi {set_thermostat, send_notification}, mong đợi {set_thermostat} → F1 ≈ 0.67.
#
# 5. Chạy (PowerShell, ở thư mục gốc repo). Promptfoo cần Node ≥ 22.22 → lệnh đầu đưa Node 24 lên trước,
#    chỉ áp cho terminal đang mở. `@0.126.0`: ghim version, không tự kéo bản mới chưa kiểm tra.
#      $env:Path = "$env:LOCALAPPDATA\nvm\v24.11.1;$env:Path"
#      $env:PROMPTFOO_DISABLE_TELEMETRY = "1"
#      npx promptfoo@0.126.0 eval -c 07-ai-security-bootcamp/04-evals/01-promptfoo-rag-metrics.yaml --env-file .env --no-cache
#      npx promptfoo@0.126.0 view
# =======================================================================


description: 6 lỗi RAG / agent — chấm câu trả lời viết sẵn

prompts:
  - '{{response}}'

providers:
  - echo

# Chạy từng test một, nghỉ 3 giây giữa các test, cho đỡ vượt giới hạn token/phút của Groq.
evaluateOptions:
  maxConcurrency: 1
  delay: 3000

# `text`: judge. `embedding`: model embedding cho `answer-relevance`.
defaultTest:
  options:
    provider:
      text:
        id: groq:openai/gpt-oss-120b
        config:
          temperature: 0
          # Tắt phần "suy nghĩ" của judge, vì nó lẫn vào câu trả lời làm Promptfoo đọc sai.
          include_reasoning: false
          reasoning_effort: low
      embedding:
        id: google:embedding:gemini-embedding-001

# `scenarios`: mỗi metric 1 khối. `tests`: cách chấm (khai báo 1 lần). `config`: 3 mẫu tốt / trung bình / tệ.
# Promptfoo ghép từng mẫu với cách chấm → 3 test. `{{reference}}` (đáp án mẫu) lấy từ `vars` của từng mẫu.
scenarios:
  # ── 1. Bịa thông tin — chính sách đổi trả ─────────────────────────────
  - description: '1. Faithfulness'
    tests:
      - assert:
          - type: context-faithfulness
            metric: faithfulness
            threshold: 0.75
    config:
      - description: '1. Faithfulness — TỐT: chỉ dùng thông tin trong context'
        vars:
          query: Can I return a used laptop?
          context: |-
            Our return policy allows returns within 30 days of purchase for unused, unopened electronics.
            Items must be in original packaging with all accessories included.
          response: According to the return policy, laptops must be unused and in original packaging to be eligible for a return within 30 days.
      - description: '1. Faithfulness — TRUNG BÌNH: bịa thêm coupon 10%'
        vars:
          query: What is the refund timeline?
          context: Approved refunds are processed within 5 to 7 business days.
          response: Refunds are processed in 5 to 7 business days and you will also receive a 10% discount coupon on your next order.
      - description: '1. Faithfulness — TỆ: nói ngược context (miễn phí ship trả hàng)'
        vars:
          query: Do you offer free return shipping?
          context: Customers are responsible for return shipping costs unless the item is defective.
          response: Yes, we provide free prepaid return shipping labels for all returns including buyer remorse returns.

  # ── 2. Lạc đề — du lịch Nhật ──────────────────────────────────────────
  - description: '2. Answer relevancy'
    tests:
      - assert:
          - type: answer-relevance
            metric: answer_relevancy
            threshold: 0.75
    config:
      - description: '2. Answer relevancy — TỐT: trả lời đúng câu hỏi visa'
        vars:
          query: What are the visa requirements for visiting Japan from India?
          response: Indian citizens need a tourist visa to enter Japan. You apply at the Japanese embassy with your passport, recent photos, and a travel itinerary.
      - description: '2. Answer relevancy — TRUNG BÌNH: chung chung, không nêu địa điểm nào'
        vars:
          query: What are the best places to visit in Japan in April?
          response: Japan is a wonderful country with many beautiful places to visit. There are so many things to see and do throughout the year.
      - description: '2. Answer relevancy — TỆ: hỏi vé tàu, trả lời về đồ ăn'
        vars:
          query: How do I buy a Japan Rail Pass?
          response: Japanese cuisine is incredible. Must-try dishes include sushi, ramen, and tempura during your visit.

  # ── 3. Context lẫn rác — hỏi Python ───────────────────────────────────
  - description: '3. Context relevance'
    tests:
      - assert:
          - type: context-relevance
            metric: context_relevance
            threshold: 0.75
    config:
      - description: '3. Context relevance — TỐT: 2 đoạn đúng, 1 đoạn rác ở cuối'
        vars:
          query: How do I read a CSV file in Python?
          context: |-
            Use pandas: import pandas as pd; df = pd.read_csv('file.csv') to load a CSV into a DataFrame.
            pd.read_csv() accepts parameters like sep, header, encoding, and index_col for customisation.
            Python lists are ordered, mutable sequences defined with square brackets.
          response: "To read a CSV in Python, use pandas: import pandas as pd; df = pd.read_csv('file.csv'). You can also set sep, header, and encoding."
      - description: '3. Context relevance — TRUNG BÌNH: 1 đoạn rác đứng trước đoạn đúng'
        vars:
          query: How do I reverse a string in Python?
          context: |-
            Python supports various data types: int, float, string, list, and dict.
            To reverse a string, use slicing: s[::-1] or use ''.join(reversed(s)).
          response: 'You can reverse a string using slicing: s[::-1].'
      - description: '3. Context relevance — TỆ: 2 đoạn rác đứng trước đoạn đúng duy nhất'
        vars:
          query: How do I sort a list in Python?
          context: |-
            Python decorators wrap functions to add behaviour using the @ symbol.
            The Global Interpreter Lock (GIL) affects multithreaded Python performance.
            Use list.sort() for in-place sorting or sorted(list) for a new sorted list.
          response: Use list.sort() to sort in-place or sorted(list) to get a new sorted list.

  # ── 4. Context thiếu ý — công thức nấu ăn ─────────────────────────────
  - description: '4. Context recall'
    tests:
      - assert:
          - type: context-recall
            metric: context_recall
            threshold: 0.75
            value: '{{reference}}'
    config:
      - description: '4. Context recall — TỐT: context đủ cả 4 bước'
        vars:
          query: How do I make a classic French omelette?
          context: |-
            Crack 3 eggs into a bowl and whisk until smooth. Season with salt and pepper.
            Heat butter in a non-stick pan over medium heat until foamy but not brown.
            Pour the eggs in and stir with a spatula while shaking the pan for 30 seconds.
            Fold the omelette into thirds and slide onto a plate — it should be pale yellow, not browned.
          response: Whisk 3 eggs with salt and pepper. Melt butter until foamy, pour eggs in, stir and shake for 30 seconds, fold into thirds. Serve pale yellow.
          reference: Whisk 3 eggs, season, cook in foamy butter over medium heat stirring constantly, fold into thirds. The omelette should stay pale, not browned.
      - description: '4. Context recall — TRUNG BÌNH: thiếu bột, nhiệt độ lò, thời gian nướng'
        vars:
          query: What are the steps to make banana bread?
          context: |-
            Mash 3 ripe bananas in a mixing bowl.
            Mix in 75g melted butter, 150g sugar, 1 egg, and 1 tsp vanilla extract.
          response: Mash the bananas, mix with butter, sugar, egg, and vanilla, pour into a loaf tin and bake until golden.
          reference: Mash 3 bananas, mix with butter, sugar, egg, vanilla, fold in 190g flour with baking soda and salt. Bake at 175 C for 60 minutes.
      - description: '4. Context recall — TỆ: context chỉ có chuyện lịch sử mì Ý'
        vars:
          query: How long should I cook spaghetti?
          context: |-
            Pasta was introduced to Italy from Arab traders in the 12th century.
            There are over 350 recognised pasta shapes in Italian culinary tradition.
          response: Cook pasta according to the package instructions until al dente.
          reference: Boil spaghetti in salted water for 8 to 10 minutes. Taste one strand 1 to 2 minutes before the package time for al dente texture.

  # ── 5. Sai sự thật — kiến thức phổ thông ──────────────────────────────
  - description: '5. Factuality'
    tests:
      - assert:
          - type: factuality
            metric: factuality
            value: '{{reference}}'
    config:
      - description: '5. Factuality — TỐT: khớp đáp án chuẩn'
        vars:
          query: Who invented the telephone?
          response: Alexander Graham Bell invented the telephone and received the patent in 1876.
          reference: Alexander Graham Bell invented the telephone, patenting it in 1876.
      - description: '5. Factuality — TRUNG BÌNH: đúng chủ đề, sai con số (90°C)'
        vars:
          query: What is the boiling point of water at sea level?
          response: Water boils at 90 degrees Celsius at sea level.
          reference: Water boils at 100 degrees Celsius (212 F) at sea level.
      - description: '5. Factuality — TỆ: sai hẳn (Sao Kim thay vì Sao Thủy)'
        vars:
          query: Which planet is closest to the Sun?
          response: Venus is the closest planet to the Sun.
          reference: Mercury is the closest planet to the Sun.

  # ── 6. Gọi sai tool — trợ lý nhà thông minh ───────────────────────────
  - description: '6. Tool call'
    tests:
      - assert:
          - type: tool-call-f1
            metric: tool_correctness
            threshold: 0.75
            value: '{{expected_tools}}'
    # `response`: danh sách tool agent đã gọi, viết theo định dạng tool call của OpenAI để `tool-call-f1` đọc được.
    config:
      - description: '6. Tool call — TỐT: gọi đúng tool bật đèn'
        vars:
          query: Turn on the living room lights
          response: '[{"type":"function","function":{"name":"control_smart_light","arguments":"{\"room\":\"living room\",\"action\":\"on\"}"}}]'
          expected_tools: control_smart_light
      - description: '6. Tool call — TRUNG BÌNH: muốn mở nhạc, lại gọi tool bật đèn'
        vars:
          query: Play jazz music in the kitchen
          response: '[{"type":"function","function":{"name":"control_smart_light","arguments":"{\"room\":\"kitchen\",\"action\":\"on\"}"}}]'
          expected_tools: play_music
      - description: '6. Tool call — TỆ: đúng tool chỉnh nhiệt độ nhưng gọi thừa tool gửi thông báo'
        vars:
          query: Set the thermostat to 22 degrees
          response: '[{"type":"function","function":{"name":"set_thermostat","arguments":"{\"temperature\":22}"}},{"type":"function","function":{"name":"send_notification","arguments":"{\"message\":\"Thermostat set to 22 C\"}"}}]'
          expected_tools: set_thermostat
